openapi: 3.1.0
info:
  title: API MNI/PJe — ms-mni
  version: "1.0.0"
  description: |
    API REST externa do ms-mni para consulta de processos, documentos e
    tribunais via integração MNI/PJe.

    ## Autenticação
    Todas as rotas exigem o header `X-API-Token` com um token válido, exceto
    `POST /ocr/webhook`, que só o workflow do OCR chama e que se autentica
    pela credencial do próprio `webhook_url` (`security: []`).

    ## Aviso de segurança
    Os endpoints de consulta de processo e documento recebem `login_pje` e
    `senha_pje` como **query params**. Isso expõe credenciais PJe na URL (logs
    de servidor, histórico de proxy). **Não registre em log as URLs completas
    destas requisições.**

    ## Mudanças acordadas (DEP-03 e DEP-05)
    `POST /processo/ocr` (DEP-03), o webhook `ocr_progresso` (DEP-05) e os
    schemas `SolicitacaoDeOcr`, `ProcessamentoDeOcr` e `AvisoDeProgressoDoOcr`
    seguem a cópia acordada com o Sistema Jurídico, com estas divergências:
    - **D-01**: `POST /ocr/webhook` entra neste contrato, porque toda rota da
      API é documentada. Só o workflow do OCR chama; não está na cópia
      acordada.
    - **D-02**: o `422` sai com a mensagem do Laravel em inglês
      (`APP_LOCALE=en`, ex.: "The senha pje field is required.") e traz
      também `errors`.
    - **D-03**: fora de `production`, `callback_url` aceita `http` e IP
      interno para os hosts liberados (`CALLBACK_HOSTS_LIBERADOS`). Em
      `production`, só `https` com IP público.
    - **D-04**: o par `login_pje`/`senha_pje` só fica em jobs cifrados. Um
      job que falha de vez guarda o payload cifrado em `failed_jobs` e no
      Horizon por até 10.080 min.
    - **D-05**: `callback_url` tem até 2.048 caracteres (`maxLength: 2048`,
      a única diferença estrutural).
    - **D-06**: `numero_processo` com máscara é aceito e normalizado para os
      20 dígitos; o schema continua com `pattern: '^[0-9]{20}$'`.
    - **D-07**: as imagens vão ao OCR com `filename`
      `{id_documento}.{png|jpg|webp|tif|bmp|gif}`, pela extensão do
      mimetype; PDF e HTML vão com `{id_documento}.pdf`.
    - **D-08**: `com_erro` é "erro definitivo neste processamento". Um pedido
      que abre processamento devolve à fila os documentos com erro do
      processamento anterior, e o `com_erro` do `202` da reabertura cai
      (ex.: de 5 para 0).

    ## Mudanças acordadas (DEP-07)
    Cópia acordada com o Sistema Jurídico (feature visualizador-de-processo),
    marcada com `x-dependencia: DEP-07`:
    - `GET /processo/visualizar` traz, em cada documento, os campos novos
      `tipo` (resolvido sem uma consulta por documento), `data_juntada`,
      `usuario_juntada_arquivo`, `mimetype`, `file_size` e a `ocr_situacao`
      calculada no ms-mni: `ignorado` só com `mimetype` não vazio fora dos
      formatos que o OCR lê; senão, a situação gravada, e a nula sai
      `pendente`.
    - `GET /documento/visualizar` traz `documento.conteudo_html` (texto ou
      null; preenchido em `text/html`), e o `link` de um documento HTML
      aponta para o PDF renderizado.
    - Os itens de `prioridades` (`Prioridade`) e de
      `partes[].representantes_processual` (`RepresentanteProcessual`)
      passam a ser descritos.
    - `total` e `ignorados` (`ProcessamentoDeOcr` e `AvisoDeProgressoDoOcr`)
      contam o documento sem `mimetype` como pendente, dentro de `total`. Ele
      sai de `total` e entra em `ignorados` quando o download revela um
      formato que o OCR não lê, então `total` pode diminuir entre avisos.
    Até o deploy no ms-mni a integração real não as tem; ao receber o yaml
    oficial, substitua as duas cópias e rode
    `tests/Feature/Servicos/MniTest.php`.
servers:
  - url: https://{host}/api
    description: Servidor da aplicação
    variables:
      host:
        default: localhost:8006
security:
  - ApiToken: []
tags:
  - name: Processos
    description: Consulta e exportação de processos
  - name: Documentos
    description: Consulta, download e OCR de documentos
  - name: Tribunais
    description: Listagem de tribunais
  - name: Monitoramentos
    description: |
      Monitoramento periódico de processos. O cliente assina um processo com um
      intervalo em horas; um comando agendado (a cada 30 min) enfileira os
      vencidos numa fila serial, que consulta o MNI **um por vez**, atualiza o
      processo e dispara o webhook `monitoramento` em **toda** execução.

      Diferente dos demais endpoints, as credenciais PJe vão no **body** (não em
      query string) e são armazenadas cifradas em tabela própria. A API nunca as
      devolve — apenas `login_mascarado`.

      Cada ciclo grava **metadados** de documentos novos, sem baixar os binários:
      o conteúdo continua sob demanda via `/documento/visualizar`.
paths:
  /tribunais:
    get:
      tags: [Tribunais]
      summary: Listar tribunais ativos
      description: Retorna todos os tribunais com `ativo = true`.
      responses:
        '200':
          description: Lista de tribunais.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Tribunal' }
        '401': { $ref: '#/components/responses/Erro401' }
  /tribunais/{uuid}:
    get:
      tags: [Tribunais]
      summary: Obter tribunal por uuid
      parameters:
        - name: uuid
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Tribunal encontrado (ou `null` se não existir).
          content:
            application/json:
              schema:
                oneOf:
                  - { $ref: '#/components/schemas/Tribunal' }
                  - { type: 'null' }
        '401': { $ref: '#/components/responses/Erro401' }
  /processo/consultar:
    get:
      tags: [Processos]
      summary: Buscar processos por número
      description: |
        Busca paginada (10 por página) por `numero_processo`. Se o processo não
        existe no banco, é baixado do MNI de forma síncrona; se existe, uma
        atualização é disparada em background.
      parameters:
        - { $ref: '#/components/parameters/LoginPje' }
        - { $ref: '#/components/parameters/SenhaPje' }
        - { $ref: '#/components/parameters/TribunalIdQuery' }
        - { $ref: '#/components/parameters/NumeroProcessoQuery' }
      responses:
        '200':
          description: Página de processos.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaginacaoProcessos' }
        '400': { $ref: '#/components/responses/Erro400' }
        '401': { $ref: '#/components/responses/Erro401' }
        '422': { $ref: '#/components/responses/Erro422' }
        '500': { $ref: '#/components/responses/Erro500' }
  /processo/visualizar:
    get:
      tags: [Processos]
      summary: Obter processo completo
      description: |
        Retorna um processo com relações completas (tribunal, partes e
        representantes, prioridades, classe, assuntos, movimentos, documentos).
        Baixa do MNI se ausente; senão dispara atualização em background.

        DEP-07: cada documento traz `tipo`, `data_juntada`,
        `usuario_juntada_arquivo`, `mimetype`, `file_size` e `ocr_situacao`
        (calculada; ver `Documento`). O `tipo` é resolvido pelos tipos do
        tribunal carregados uma vez, sem uma consulta por documento.
      parameters:
        - { $ref: '#/components/parameters/LoginPje' }
        - { $ref: '#/components/parameters/SenhaPje' }
        - { $ref: '#/components/parameters/TribunalIdQuery' }
        - { $ref: '#/components/parameters/NumeroProcessoQuery' }
      responses:
        '200':
          description: Processo encontrado.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Processo' }
        '400': { $ref: '#/components/responses/Erro400' }
        '401': { $ref: '#/components/responses/Erro401' }
        '403':
          x-dependencia: DEP-01
          description: O tribunal recusou o par `login_pje`/`senha_pje`.
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: '#/components/schemas/ErroComCodigo' }
                  - properties:
                      codigo: { const: credencial_pje_recusada }
              example: { codigo: credencial_pje_recusada, message: "Credencial PJe recusada pelo tribunal" }
        '404':
          x-dependencia: DEP-01
          description: O processo não existe no tribunal.
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: '#/components/schemas/ErroComCodigo' }
                  - properties:
                      codigo: { const: processo_nao_encontrado }
              example: { codigo: processo_nao_encontrado, message: "Processo não encontrado no tribunal" }
        '422': { $ref: '#/components/responses/Erro422' }
        '500': { $ref: '#/components/responses/Erro500' }
  /processo/dados-basicos:
    get:
      tags: [Processos]
      summary: Dados básicos do processo (síncrono)
      description: |
        Retorna dados básicos (tribunal, classe, assuntos, prioridades, partes
        e representantes). Se existe no banco, retorna direto; senão consulta o
        MNI de forma síncrona.
      parameters:
        - { $ref: '#/components/parameters/LoginPje' }
        - { $ref: '#/components/parameters/SenhaPje' }
        - { $ref: '#/components/parameters/TribunalIdQuery' }
        - { $ref: '#/components/parameters/NumeroProcessoQuery' }
      responses:
        '200':
          description: Dados básicos do processo.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Processo' }
        '401': { $ref: '#/components/responses/Erro401' }
        '422': { $ref: '#/components/responses/Erro422' }
        '500': { $ref: '#/components/responses/Erro500Generico' }
  /processo/movimentos/listar:
    get:
      tags: [Processos]
      summary: Listar movimentos (síncrono)
      description: Retorna do banco se houver movimentos; senão consulta o MNI.
      parameters:
        - { $ref: '#/components/parameters/LoginPje' }
        - { $ref: '#/components/parameters/SenhaPje' }
        - { $ref: '#/components/parameters/TribunalIdQuery' }
        - { $ref: '#/components/parameters/NumeroProcessoQuery' }
        - { $ref: '#/components/parameters/DataReferencia' }
      responses:
        '200':
          description: Lista de movimentos.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Movimento' }
        '401': { $ref: '#/components/responses/Erro401' }
        '422': { $ref: '#/components/responses/Erro422' }
        '500': { $ref: '#/components/responses/Erro500Generico' }
  /processo/documentos/listar:
    get:
      tags: [Documentos]
      summary: Listar documentos (síncrono)
      description: Retorna do banco se houver documentos; senão consulta o MNI. O campo `tipo` é resolvido.
      parameters:
        - { $ref: '#/components/parameters/LoginPje' }
        - { $ref: '#/components/parameters/SenhaPje' }
        - { $ref: '#/components/parameters/TribunalIdQuery' }
        - { $ref: '#/components/parameters/NumeroProcessoQuery' }
        - { $ref: '#/components/parameters/DataReferencia' }
      responses:
        '200':
          description: Lista de documentos.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Documento' }
        '401': { $ref: '#/components/responses/Erro401' }
        '422': { $ref: '#/components/responses/Erro422' }
        '500': { $ref: '#/components/responses/Erro500Generico' }
  /processo/consultar/dados-basicos/async:
    get:
      tags: [Processos]
      summary: Enfileirar consulta de dados básicos (assíncrono)
      description: Enfileira `ConsultarDadosBasicosProcessoMNIJob` na fila `alta`. Retorna 200 com corpo vazio.
      parameters:
        - { $ref: '#/components/parameters/LoginPje' }
        - { $ref: '#/components/parameters/SenhaPje' }
        - { $ref: '#/components/parameters/TribunalIdQuery' }
        - { $ref: '#/components/parameters/NumeroProcessoQuery' }
        - name: callback_url
          in: query
          required: true
          description: "URL https de callback (bloqueia IPs internos)."
          schema: { type: string, format: uri }
        - name: callback_token
          in: query
          required: true
          description: "Token reenviado no header X-API-Token do callback."
          schema: { type: string }
      responses:
        '200': { description: Job enfileirado. Corpo vazio. }
        '401': { $ref: '#/components/responses/Erro401' }
        '422': { $ref: '#/components/responses/Erro422' }
  /processo/consultar/movimentos/async:
    get:
      tags: [Processos]
      summary: Enfileirar consulta de movimentos (assíncrono)
      description: Enfileira `ConsultarMovimentosProcessoMNIJob` na fila `alta`. Retorna 200 com corpo vazio.
      parameters:
        - { $ref: '#/components/parameters/LoginPje' }
        - { $ref: '#/components/parameters/SenhaPje' }
        - { $ref: '#/components/parameters/TribunalIdQuery' }
        - { $ref: '#/components/parameters/NumeroProcessoQuery' }
        - name: callback_url
          in: query
          required: true
          description: "URL https de callback (bloqueia IPs internos)."
          schema: { type: string, format: uri }
        - name: callback_token
          in: query
          required: true
          description: "Token reenviado no header X-API-Token do callback."
          schema: { type: string }
      responses:
        '200': { description: Job enfileirado. Corpo vazio. }
        '401': { $ref: '#/components/responses/Erro401' }
        '422': { $ref: '#/components/responses/Erro422' }
  /processo/consultar/documentos/async:
    get:
      tags: [Documentos]
      summary: Enfileirar consulta de documentos (assíncrono)
      description: Enfileira `ConsultarDocumentosProcessoMNIJob` na fila `alta`. Retorna 200 com corpo vazio.
      parameters:
        - { $ref: '#/components/parameters/LoginPje' }
        - { $ref: '#/components/parameters/SenhaPje' }
        - { $ref: '#/components/parameters/TribunalIdQuery' }
        - { $ref: '#/components/parameters/NumeroProcessoQuery' }
        - name: callback_url
          in: query
          required: true
          description: "URL https de callback (bloqueia IPs internos)."
          schema: { type: string, format: uri }
        - name: callback_token
          in: query
          required: true
          description: "Token reenviado no header X-API-Token do callback."
          schema: { type: string }
      responses:
        '200': { description: Job enfileirado. Corpo vazio. }
        '401': { $ref: '#/components/responses/Erro401' }
        '422': { $ref: '#/components/responses/Erro422' }
  /documento/visualizar:
    get:
      tags: [Documentos]
      summary: Baixar documento e obter link temporário
      description: |
        Baixa o documento (até 3 tentativas) e retorna um link temporário do
        S3, válido por 60 minutos, em `documento.link`.

        DEP-07: num documento `text/html`, `documento.conteudo_html` traz o
        HTML, e `documento.link` aponta para o PDF renderizado. Nos demais
        tipos, `conteudo_html` é null.
      parameters:
        - { $ref: '#/components/parameters/LoginPje' }
        - { $ref: '#/components/parameters/SenhaPje' }
        - { $ref: '#/components/parameters/TribunalIdQuery' }
        - { $ref: '#/components/parameters/NumeroProcessoQuery' }
        - { $ref: '#/components/parameters/IdDocumento' }
      responses:
        '200':
          description: Documento consultado com sucesso.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string, example: "Documento 12345 consultado com sucesso" }
                  documento: { $ref: '#/components/schemas/Documento' }
        '401': { $ref: '#/components/responses/Erro401' }
        '403':
          x-dependencia: DEP-01
          description: O tribunal recusou o par `login_pje`/`senha_pje`.
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: '#/components/schemas/ErroComCodigo' }
                  - properties:
                      codigo: { const: credencial_pje_recusada }
              example: { codigo: credencial_pje_recusada, message: "Credencial PJe recusada pelo tribunal" }
        '404':
          x-dependencia: DEP-01
          description: |
            Dois casos, distinguidos pelo campo `codigo`:
            - `codigo` = `processo_nao_encontrado` (DEP-01): o processo não existe
              no tribunal;
            - sem `codigo`: documento não obtido após as tentativas.
          content:
            application/json:
              schema:
                oneOf:
                  - allOf:
                      - { $ref: '#/components/schemas/ErroComCodigo' }
                      - properties:
                          codigo: { const: processo_nao_encontrado }
                  - allOf:
                      - { $ref: '#/components/schemas/ErroMensagem' }
                      - not: { required: [codigo] }
              examples:
                processo_nao_encontrado:
                  summary: Processo inexistente no tribunal (DEP-01)
                  value: { codigo: processo_nao_encontrado, message: "Processo não encontrado no tribunal" }
                documento_nao_obtido:
                  summary: Documento não obtido após as tentativas
                  value: { message: "Não foi possível obter o documento 12345 do processo ... após 3 tentativas" }
        '422': { $ref: '#/components/responses/Erro422' }
        '500':
          description: Erro interno.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErroMensagem' }
  /processo/download:
    post:
      tags: [Processos]
      summary: Exportar processo em PDF (assíncrono)
      description: |
        Enfileira a geração de um PDF de exportação. O arquivo pronto é
        entregue via webhook de saída (ver seção `webhooks`). Retorna
        imediatamente o `exportacao_id`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [numero_processo, user_id, titulo, formato, callback_url, callback_token]
              properties:
                numero_processo: { type: string, maxLength: 25 }
                tribunal_id: { type: [integer, 'null'] }
                user_id: { type: integer, minimum: 1, description: "Eco no webhook." }
                titulo: { type: string, maxLength: 255, description: "Eco no webhook." }
                formato: { type: string, enum: [pdf] }
                ids_selecionados:
                  type: array
                  items: { type: integer }
                periodo_inicial: { type: string, format: date, description: "required_with periodo_final" }
                periodo_final: { type: string, format: date, description: "required_with periodo_inicial" }
                id_inicial: { type: integer, description: "required_with id_final" }
                id_final: { type: integer, description: "required_with id_inicial" }
                callback_url:
                  type: string
                  format: uri
                  description: "URL https do chamador que receberá a notificação de conclusão. Bloqueia IPs internos."
                callback_token:
                  type: string
                  description: "Token reenviado no header X-API-Token da chamada de callback, para o chamador validar a origem."
      responses:
        '200':
          description: Exportação enfileirada.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExportacaoEnfileirada' }
        '401': { $ref: '#/components/responses/Erro401' }
        '404':
          description: Nenhum documento encontrado com os filtros aplicados.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Erro' }
              example: { error: "Nenhum documento encontrado para o processo informado com os filtros aplicados." }
        '422': { $ref: '#/components/responses/Erro422' }
  /processo/ocr:
    post:
      tags: [Documentos]
      x-dependencia: DEP-03
      summary: Baixar os documentos do processo e mandar ao OCR (assíncrono)
      description: |
        Garante o processo e a lista de documentos (consulta o MNI com o par
        recebido, se preciso), enfileira o download e o OCR dos documentos
        pendentes e responde `202` com as contagens. O progresso chega pelo
        webhook `ocr_progresso` (DEP-05), no `callback_url`, com
        `X-API-Token: {callback_token}`.

        - **Chave processo + linha**: o processamento e o índice do OCR são
          chaveados por `numero_processo` + `tribunal_id`, sem escritório. Um
          OCR serve a todos os clientes que pedem o mesmo processo e linha.
        - **Par do membro**: `login_pje`/`senha_pje` vão só no corpo, nunca na
          URL. O par só fica cifrado, nos jobs da fila que baixa os documentos,
          nunca em log nem em tabela do ms-mni. Um job que falha de vez guarda
          o payload cifrado em `failed_jobs` e no Horizon por até 10.080 min
          (D-04). O corpo desta requisição nunca vai para o log.
        - **Fora do `InjectCredenciaisPjePadrao`**: como o grupo de
          monitoramento, esta rota nunca usa o par padrão do servidor. Sem
          `login_pje` e `senha_pje` preenchidos, responde `422`.
        - **Carona**: um pedido do mesmo processo e linha com processamento em
          andamento, de qualquer cliente, não enfileira de novo e não usa nem
          guarda o par desse pedido. Responde `202` com a contagem atual e
          passa a avisar também o novo `callback_url`, até o fim.
        - **Incremental**: documento já lido pelo OCR não é lido de novo, venha
          o pedido de qualquer cliente. Sem documento pendente, com erro ou
          aguardando retorno, responde `202` com `situacao` = `concluido`. Um
          pedido que abre processamento devolve à fila os documentos com erro
          do processamento anterior (D-08).
        - **Sem fan-out**: processa só a linha do `tribunal_id` recebido, nunca
          as outras linhas do mesmo tribunal.
        - **Formatos**: `total` conta os documentos em formato que o OCR lê
          (PDF, HTML pelo PDF renderizado e as imagens aceitas); os demais
          contam em `ignorados`.
        - **Espera**: pedidos simultâneos do mesmo processo e linha esperam a
          decisão um do outro por até 45 s (configurável). Esgotada a espera,
          responde `500` sem registrar o pedido; basta repetir.
      security:
        - ApiToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SolicitacaoDeOcr' }
      responses:
        '202':
          description: Pedido aceito (processamento novo, carona ou já concluído).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProcessamentoDeOcr' }
              example: { numero_processo: "12345674220268260100", tribunal_id: 12, total: 300, processados: 0, com_erro: 0, ignorados: 4, situacao: em_andamento }
        '401': { $ref: '#/components/responses/Erro401' }
        '403':
          description: O tribunal recusou o par `login_pje`/`senha_pje`.
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: '#/components/schemas/ErroComCodigo' }
                  - properties:
                      codigo: { const: credencial_pje_recusada }
              example: { codigo: credencial_pje_recusada, message: "Credencial PJe recusada pelo tribunal" }
        '404':
          description: O processo não existe no tribunal.
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: '#/components/schemas/ErroComCodigo' }
                  - properties:
                      codigo: { const: processo_nao_encontrado }
              example: { codigo: processo_nao_encontrado, message: "Processo não encontrado no tribunal" }
        '422':
          description: |
            Falha de validação, inclusive sem `login_pje` ou `senha_pje`
            preenchidos (nunca usa o par padrão do servidor). A mensagem sai
            em inglês (`APP_LOCALE=en`, D-02) e o corpo traz também `errors`.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErroMensagem' }
              example: { message: "The senha pje field is required.", errors: { senha_pje: ["The senha pje field is required."] } }
        '500': { $ref: '#/components/responses/Erro500Generico' }
  /processo/monitoramentos:
    post:
      tags: [Monitoramentos]
      summary: Criar ou atualizar monitoramento de processo
      description: |
        Assina o monitoramento periódico de um processo. A primeira execução
        entra no próximo tick do agendador (até 30 min).

        `login_pje`/`senha_pje` são opcionais e formam um **par atômico** (um sem
        o outro → 422). Quando informados, são cifrados em `credenciais_pje`;
        quando ausentes, cada execução usa o par padrão do ambiente.

        **Repetir o POST para o mesmo (token, tribunal, processo) atualiza o
        monitoramento existente e responde `200`** — é o caminho para corrigir
        uma credencial errada sem cancelar e recriar. `201` só quando criou de
        fato. Na atualização:

        - `intervalo_horas`, `callback_url` e `callback_token` são sobrescritos;
        - omitir o par de credenciais **mantém** a credencial atual;
        - credencial nova zera `falhas_consecutivas`, tira o monitoramento de
          `suspenso` e antecipa a próxima execução para o tick seguinte;
        - `pausado` continua pausado: retomar é o `PATCH` com `status: ativo`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MonitoramentoCriar' }
      responses:
        '200':
          description: Já existia monitoramento para o processo; foi atualizado.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Monitoramento' }
        '201':
          description: Monitoramento criado.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Monitoramento' }
        '401': { $ref: '#/components/responses/Erro401' }
        '422': { $ref: '#/components/responses/Erro422' }
    get:
      tags: [Monitoramentos]
      summary: Listar monitoramentos do token
      description: Retorna apenas os monitoramentos criados pelo token autenticado, 10 por página.
      parameters:
        - name: status
          in: query
          required: false
          description: Filtro opcional por status.
          schema: { type: string, enum: [ativo, pausado, suspenso, cancelado] }
        - name: page
          in: query
          required: false
          schema: { type: integer, minimum: 1 }
      responses:
        '200':
          description: Página de monitoramentos.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Monitoramento' }
        '401': { $ref: '#/components/responses/Erro401' }
  /processo/monitoramentos/{uuid}:
    get:
      tags: [Monitoramentos]
      summary: Detalhar monitoramento
      description: Inclui as 10 execuções mais recentes. uuid de outro token responde 404.
      parameters:
        - { $ref: '#/components/parameters/MonitoramentoUuid' }
      responses:
        '200':
          description: Monitoramento encontrado.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Monitoramento' }
        '401': { $ref: '#/components/responses/Erro401' }
        '404': { $ref: '#/components/responses/Erro404Monitoramento' }
    patch:
      tags: [Monitoramentos]
      summary: Atualizar credenciais, intervalo, callback ou status
      description: |
        Atualização parcial: todos os campos são opcionais e o que não vier
        fica como está.

        `status` aceita apenas `ativo` e `pausado` — cancelar é o `DELETE`.
        Retomar (`ativo`) zera `falhas_consecutivas` e reagenda para o próximo
        tick.

        `login_pje`/`senha_pje` formam um **par atômico** (um sem o outro →
        422) e substituem a credencial do monitoramento. Omitir os dois
        **mantém** a credencial atual — não é o caminho para voltar ao par
        padrão do ambiente. Trocar a credencial zera `falhas_consecutivas`,
        tira o monitoramento de `suspenso` e antecipa a próxima execução;
        `pausado` continua pausado.

        Mudar `intervalo_horas` reancora a agenda na última execução
        (`ultima_execucao_em + intervalo_horas`, ou o próximo tick se isso já
        passou), então encurtar o intervalo vale na hora em vez de esperar o
        ciclo antigo terminar. Quem ainda não executou nenhuma vez mantém o
        agendamento do primeiro tick.
      parameters:
        - { $ref: '#/components/parameters/MonitoramentoUuid' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                intervalo_horas: { type: integer, minimum: 1, maximum: 720 }
                callback_url: { type: string, format: uri }
                callback_token: { type: string, maxLength: 500 }
                status: { type: string, enum: [ativo, pausado] }
                login_pje:
                  type: string
                  maxLength: 255
                  description: Exige `senha_pje` junto. Cifrado em repouso, nunca devolvido.
                senha_pje:
                  type: string
                  maxLength: 255
                  description: Exige `login_pje` junto. Cifrado em repouso, nunca devolvido.
      responses:
        '200':
          description: Monitoramento atualizado.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Monitoramento' }
        '401': { $ref: '#/components/responses/Erro401' }
        '404': { $ref: '#/components/responses/Erro404Monitoramento' }
        '422': { $ref: '#/components/responses/Erro422' }
    delete:
      tags: [Monitoramentos]
      summary: Cancelar monitoramento
      description: Marca como `cancelado` e faz soft delete, preservando o histórico de execuções. Libera o processo para uma nova assinatura.
      parameters:
        - { $ref: '#/components/parameters/MonitoramentoUuid' }
      responses:
        '204': { description: Cancelado. Corpo vazio. }
        '401': { $ref: '#/components/responses/Erro401' }
        '404': { $ref: '#/components/responses/Erro404Monitoramento' }
  /processo/monitoramentos/{uuid}/execucoes:
    get:
      tags: [Monitoramentos]
      summary: Histórico de execuções
      parameters:
        - { $ref: '#/components/parameters/MonitoramentoUuid' }
        - name: page
          in: query
          required: false
          schema: { type: integer, minimum: 1 }
      responses:
        '200':
          description: Página de execuções, mais recentes primeiro.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/MonitoramentoExecucao' }
        '401': { $ref: '#/components/responses/Erro401' }
        '404': { $ref: '#/components/responses/Erro404Monitoramento' }
  /processo/monitoramentos/{uuid}/executar:
    post:
      tags: [Monitoramentos]
      summary: Executar agora (fora do agendamento)
      description: Enfileira uma execução imediata na fila `monitoramento` sem alterar `proxima_execucao_em`. Útil para testar o webhook.
      parameters:
        - { $ref: '#/components/parameters/MonitoramentoUuid' }
      responses:
        '202':
          description: Execução enfileirada.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string, example: "Execução enfileirada" }
                  uuid: { type: string, format: uuid }
        '401': { $ref: '#/components/responses/Erro401' }
        '404': { $ref: '#/components/responses/Erro404Monitoramento' }
  /ocr/webhook:
    post:
      tags: [Documentos]
      x-dependencia: DEP-04
      summary: Retorno do workflow "Jurídico OCR (Gemini)" (só o workflow chama)
      description: |
        Chamado pelo workflow do n8n (nós "Avisar o sistema" e "Avisar falha")
        no `webhook_url` que o ms-mni mandou em cada envio de documento (D-01).

        - Fora de `X-API-Token`: a credencial vai na query do `webhook_url`,
          gerada pelo ms-mni por documento e válida por M = 60 min
          (configurável) depois do envio, sempre ≥ A = 20 min (RF-11). O
          workflow chama a URL como recebida; o formato da credencial é
          interno do ms-mni.
        - `success` marca o documento como lido (prevalece sobre o erro);
          `error` marca o documento aguardando retorno como erro definitivo e
          nunca rebaixa um documento já lido. Retorno repetido responde `200`
          sem mudança.
        - `job_id` desconhecido, de job cancelado pelo ms-mni ou de documento
          devolvido à fila responde `404`, sem mudança.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RetornoDoWorkflowOcr' }
      responses:
        '200':
          description: Retorno aceito, inclusive o repetido e o `error` sobre um documento já lido.
        '401':
          description: Sem credencial válida no `webhook_url`.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErroMensagem' }
        '404':
          description: "`job_id` desconhecido, cancelado pelo ms-mni ou de documento devolvido à fila."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErroMensagem' }
        '422': { $ref: '#/components/responses/Erro422' }
webhooks:
  monitoramento:
    post:
      summary: Notificação de execução de monitoramento
      description: |
        Disparado em **toda** execução agendada — com ou sem novidade no
        processo. O ms-mni faz `POST {callback_url}` com os headers:

        | header | conteúdo |
        |---|---|
        | `X-API-Token` | o `callback_token` informado na criação |
        | `X-Evento` | `processo.monitoramento.executado` |
        | `X-Idempotency-Key` | `execucao_id` — use para deduplicar reenvios |

        Retentativas: 5 tentativas com backoff `10s, 1min, 5min, 15min, 1h`.
        Resposta 4xx é tratada como rejeição permanente (não retenta); 5xx
        retenta. Listas de itens são limitadas a 500 elementos —
        `resumo.truncado = true` sinaliza o corte.
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WebhookMonitoramentoPayload' }
            examples:
              com_alteracao:
                summary: Execução com movimento e documento novos
                value:
                  evento: processo.monitoramento.executado
                  monitoramento_id: "9f1c2b3a-4d5e-6f70-8192-a3b4c5d6e7f8"
                  execucao_id: "c2e0d1f2-3a4b-5c6d-7e8f-9a0b1c2d3e4f"
                  numero_processo: "00008323520244013200"
                  tribunal_id: 12
                  executado_em: "2026-08-12T18:03:04-03:00"
                  status: sucesso
                  primeira_execucao: false
                  houve_alteracao: true
                  resumo: { movimentos_novos: 2, documentos_novos: 1, truncado: false }
                  movimentos:
                    - identificador_movimento: "MOV-2026-0001"
                      codigo_nacional: 123
                      complemento: "Conclusos para despacho"
                      data_hora: "2026-08-12T09:12:00-03:00"
                  documentos:
                    - id_documento: 900001
                      descricao: "Petição inicial"
                      tipo_documento: "57"
                      mimetype: "application/pdf"
                      data_hora: "2026-08-12T09:12:00-03:00"
                      nivel_sigilo: 0
                  proxima_execucao_em: "2026-08-13T00:03:00-03:00"
              sem_alteracao:
                summary: Execução sem novidade
                value:
                  evento: processo.monitoramento.executado
                  monitoramento_id: "9f1c2b3a-4d5e-6f70-8192-a3b4c5d6e7f8"
                  execucao_id: "d3f1e2a3-4b5c-6d7e-8f90-a1b2c3d4e5f6"
                  numero_processo: "00008323520244013200"
                  tribunal_id: 12
                  executado_em: "2026-08-13T00:03:02-03:00"
                  status: sucesso
                  primeira_execucao: false
                  houve_alteracao: false
                  resumo: { movimentos_novos: 0, documentos_novos: 0, truncado: false }
                  movimentos: []
                  documentos: []
                  proxima_execucao_em: "2026-08-13T06:03:00-03:00"
              falha:
                summary: Execução que falhou (e suspendeu o monitoramento)
                value:
                  evento: processo.monitoramento.executado
                  monitoramento_id: "9f1c2b3a-4d5e-6f70-8192-a3b4c5d6e7f8"
                  execucao_id: "e4a2b3c4-5d6e-7f80-9a1b-2c3d4e5f6a7b"
                  numero_processo: "00008323520244013200"
                  tribunal_id: 12
                  executado_em: "2026-08-13T06:03:01-03:00"
                  status: falha
                  houve_alteracao: false
                  erro_resumo: "MNI: credenciais inválidas"
                  falhas_consecutivas: 5
                  monitoramento_status: suspenso
      responses:
        '200': { description: Webhook recebido pelo chamador. }
  download:
    post:
      summary: Notificação de conclusão da exportação
      description: >
        Ao concluir (ou falhar) a exportação, o ms-mni faz `POST {callback_url}`
        (a URL informada na requisição de download), com header
        `X-API-Token: {callback_token}`. O chamador implementa este endpoint.
        Payload tipado por status.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [user_id, titulo, formato, status]
              properties:
                user_id: { type: integer, description: "Eco do user_id informado em /processo/download." }
                titulo: { type: string, description: "Eco do titulo informado em /processo/download." }
                formato: { type: string, example: "pdf" }
                status: { type: string, enum: [concluido, falhou] }
                download_url:
                  type: string
                  format: uri
                  description: "URL pré-assinada do S3, validade 60 min. Presente quando status=concluido."
                tamanho_bytes:
                  type: integer
                  description: "Tamanho do PDF em bytes. Presente quando status=concluido."
                erro_resumo:
                  type: string
                  description: "Resumo do erro. Presente quando status=falhou."
            examples:
              concluido:
                summary: Exportação concluída
                value:
                  user_id: 42
                  titulo: "Processo 0001234-56.2024.8.26.0100"
                  formato: pdf
                  status: concluido
                  download_url: "https://s3.example.com/downloads/42/9f2c9b1a-1e3a-4d3a-8b7a-2f6f1c9a0b1c.pdf?X-Amz-..."
                  tamanho_bytes: 184320
              falhou:
                summary: Exportação falhou
                value:
                  user_id: 42
                  titulo: "Processo 0001234-56.2024.8.26.0100"
                  formato: pdf
                  status: falhou
                  erro_resumo: "Nenhum documento encontrado para o processo informado com os filtros aplicados."
      responses:
        '200': { description: Webhook recebido pelo chamador. }
  atualizar_processo:
    post:
      summary: Notificação de conclusão de consulta assíncrona
      description: |
        Ao concluir uma consulta assíncrona (dados-básicos/movimentos/documentos),
        o ms-mni faz POST na callback_url informada, com header X-API-Token.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [numero_processo, tipo, status]
              properties:
                numero_processo: { type: string }
                tipo: { type: string, enum: [dados-basicos, movimentos, documentos] }
                status: { type: string, example: concluido }
      responses:
        '200': { description: Webhook recebido pelo chamador. }
  ocr_progresso:
    post:
      x-dependencia: DEP-05
      summary: Progresso do OCR dos documentos do processo
      description: |
        Para cada pedido aceito em `POST /processo/ocr` (DEP-03), inclusive o
        que pegou carona, o ms-mni faz `POST {callback_url}` com o header
        `X-API-Token: {callback_token}` do próprio pedido. O `callback_url` é
        usado como recebido, com a query (a assinatura do chamador vai nela).

        - Um aviso a cada documento lido pelo OCR ou com erro definitivo, mais
          um aviso final com `situacao` = `concluido` ou `falhou`.
        - As contagens vão no corpo, porque o chamador não lê o banco do ms-mni.
          `processados` + `com_erro` é o progresso sobre `total`, dentro do
          mesmo processamento (D-08).
        - `codigo` só vem com `situacao` = `falhou`: quando o tribunal recusa o
          par no meio do processamento, `credencial_pje_recusada` vai só ao
          pedido cujo par foi usado, e `credencial_de_outro_pedido_recusada`
          aos pedidos de carona. Nas demais falhas, `codigo` não vem.

        Retentativas: 5 tentativas, como o webhook `monitoramento`. Resposta
        4xx é tratada como rejeição permanente (não retenta e encerra os avisos
        daquele pedido); 5xx retenta.
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AvisoDeProgressoDoOcr' }
      responses:
        '200': { description: Aviso recebido pelo chamador. }
        '4XX': { description: Rejeição permanente; o ms-mni para de avisar este pedido. }
components:
  securitySchemes:
    ApiToken:
      type: apiKey
      in: header
      name: X-API-Token
      description: Token de API emitido pelo ms-mni.
  schemas:
    Erro:
      type: object
      description: Erro genérico com detalhes de origem (respostas 500).
      properties:
        error:
          type: string
          example: "Mensagem do erro"
        line:
          type: integer
          example: 49
        file:
          type: string
          example: "/app/Http/Controllers/Api/ConsultarProcessoController.php"
      required: [error]
    ErroMensagem:
      type: object
      description: Erro simples com apenas mensagem.
      properties:
        message:
          type: string
          example: "Token inválido ou não fornecido"
      required: [message]
    ErroComCodigo:
      type: object
      x-dependencia: DEP-01
      description: |
        Erro com código estável para o cliente decidir sem ler o texto:
        - `credencial_pje_recusada` (`403`): o tribunal recusou o par
          `login_pje`/`senha_pje`;
        - `processo_nao_encontrado` (`404`): o processo não existe no tribunal.
        `message` é só informativo e nunca contém a credencial.
      properties:
        codigo: { type: string, enum: [credencial_pje_recusada, processo_nao_encontrado] }
        message: { type: string, example: "Credencial PJe recusada pelo tribunal" }
      required: [codigo, message]
    SolicitacaoDeOcr:
      type: object
      x-dependencia: DEP-03
      description: Corpo de `POST /processo/ocr`. Todos os campos são obrigatórios.
      required: [numero_processo, tribunal_id, login_pje, senha_pje, callback_url, callback_token]
      properties:
        numero_processo:
          type: string
          pattern: '^[0-9]{20}$'
          description: "Os 20 dígitos do número CNJ. Com `tribunal_id`, é a chave do processamento e do índice, sem escritório. O servidor também aceita o número com máscara e o normaliza (D-06)."
          example: "12345674220268260100"
        tribunal_id:
          type: integer
          minimum: 1
          description: "Linha do tribunal (tribunal ativo). Só esta linha é processada, sem fan-out."
        login_pje:
          type: string
          minLength: 1
          description: "Login do PJe; o par do membro; só no corpo, nunca na URL; só em job cifrado, nunca em log nem em tabela do ms-mni."
        senha_pje:
          type: string
          minLength: 1
          description: "Senha do PJe; o par do membro; só no corpo, nunca na URL; só em job cifrado, nunca em log nem em tabela do ms-mni."
        callback_url:
          type: string
          format: uri
          maxLength: 2048
          description: "URL https do aviso de progresso (webhook `ocr_progresso`), usada como recebida. Bloqueia IPs internos. Fora de `production`, aceita `http` e IP interno para os hosts liberados (D-03). Até 2.048 caracteres (D-05)."
        callback_token:
          type: string
          minLength: 1
          maxLength: 255
          description: "Token reenviado no header `X-API-Token` de cada aviso."
    ProcessamentoDeOcr:
      type: object
      x-dependencia: DEP-03
      description: Situação do processamento do processo e linha no momento do pedido (`202` de `POST /processo/ocr`).
      required: [numero_processo, tribunal_id, total, processados, com_erro, ignorados, situacao]
      properties:
        numero_processo: { type: string, pattern: '^[0-9]{20}$' }
        tribunal_id: { type: integer, minimum: 1 }
        total: { type: integer, minimum: 0, description: "Documentos em formato que o OCR lê e documentos ainda sem mimetype, pendentes até o download (DEP-07)." }
        processados: { type: integer, minimum: 0, description: "Documentos já lidos pelo OCR, em qualquer processamento." }
        com_erro: { type: integer, minimum: 0, description: "Documentos com erro definitivo no download ou no OCR neste processamento (D-08)." }
        ignorados: { type: integer, minimum: 0, description: "Documentos com mimetype conhecido fora dos formatos que o OCR lê; ficam fora de `total`. Um documento sem mimetype sai de `total` e entra aqui quando o download revela um formato que o OCR não lê (DEP-07)." }
        situacao:
          type: string
          enum: [em_andamento, concluido]
          description: "`concluido` quando não há documento pendente (tudo já lido, inclusive antes deste pedido)."
    AvisoDeProgressoDoOcr:
      type: object
      x-dependencia: DEP-05
      description: Corpo do webhook `ocr_progresso`.
      required: [numero_processo, tribunal_id, total, processados, com_erro, ignorados, situacao]
      properties:
        numero_processo: { type: string, pattern: '^[0-9]{20}$' }
        tribunal_id: { type: integer, minimum: 1 }
        total: { type: integer, minimum: 0, description: "Documentos em formato que o OCR lê e documentos ainda sem mimetype, pendentes até o download (DEP-07). `total` pode diminuir entre avisos." }
        processados: { type: integer, minimum: 0 }
        com_erro: { type: integer, minimum: 0 }
        ignorados: { type: integer, minimum: 0, description: "Documentos com mimetype conhecido fora dos formatos que o OCR lê; ficam fora de `total`. Um documento sem mimetype sai de `total` e entra aqui quando o download revela um formato que o OCR não lê, então `total` pode diminuir entre avisos (DEP-07)." }
        situacao: { type: string, enum: [em_andamento, concluido, falhou] }
        codigo:
          type: string
          enum: [credencial_pje_recusada, credencial_de_outro_pedido_recusada]
          description: |
            Só com `situacao` = `falhou`:
            - `credencial_pje_recusada`: o tribunal recusou o par enviado neste
              pedido;
            - `credencial_de_outro_pedido_recusada`: o tribunal recusou o par de
              outro pedido, no processamento em que este pegou carona.
            Ausente nas demais falhas.
      if: { required: [codigo] }
      then:
        properties:
          situacao: { const: falhou }
    MonitoramentoCriar:
      type: object
      required: [numero_processo, tribunal_id, intervalo_horas, callback_url, callback_token]
      properties:
        numero_processo:
          type: string
          maxLength: 25
          description: "Aceita com ou sem máscara; é normalizado para só dígitos."
          example: "0000832-35.2024.4.01.3200"
        tribunal_id:
          type: integer
          description: "Tribunal ativo."
        intervalo_horas:
          type: integer
          minimum: 1
          maximum: 720
          description: "Periodicidade da consulta, de 1 hora a 30 dias."
          example: 6
        callback_url:
          type: string
          format: uri
          maxLength: 2048
          description: "URL https que recebe o webhook a cada execução. Bloqueia IPs internos."
        callback_token:
          type: string
          maxLength: 500
          description: "Reenviado no header X-API-Token do webhook, para o chamador validar a origem."
        login_pje:
          type: string
          maxLength: 255
          description: "Opcional. Par atômico com senha_pje. Armazenado cifrado; nunca é devolvido."
        senha_pje:
          type: string
          maxLength: 255
          description: "Opcional. Par atômico com login_pje."
    Monitoramento:
      type: object
      properties:
        uuid: { type: string, format: uuid }
        numero_processo: { type: string, example: "00008323520244013200" }
        tribunal_id: { type: integer }
        intervalo_horas: { type: integer, example: 6 }
        status: { type: string, enum: [ativo, pausado, suspenso, cancelado] }
        callback_url: { type: string, format: uri }
        proxima_execucao_em: { type: [string, 'null'], format: date-time }
        ultima_execucao_em: { type: [string, 'null'], format: date-time }
        falhas_consecutivas:
          type: integer
          description: "Zerado a cada sucesso. Ao atingir 5, o monitoramento vira `suspenso`."
        credencial:
          type: [object, 'null']
          description: "null quando o monitoramento usa o par padrão do ambiente."
          properties:
            uuid: { type: string, format: uuid }
            login_mascarado: { type: string, example: "123*****900" }
        created_at: { type: [string, 'null'], format: date-time }
        execucoes:
          type: array
          description: "Presente apenas no detalhe (GET por uuid): as 10 execuções mais recentes."
          items: { $ref: '#/components/schemas/MonitoramentoExecucao' }
    MonitoramentoExecucao:
      type: object
      properties:
        uuid:
          type: string
          format: uuid
          description: "Mesmo valor do header X-Idempotency-Key do webhook."
        status: { type: string, enum: [sucesso, falha] }
        houve_alteracao: { type: boolean }
        movimentos_novos: { type: integer }
        documentos_novos: { type: integer }
        erro_resumo: { type: [string, 'null'] }
        iniciado_em: { type: [string, 'null'], format: date-time }
        finalizado_em: { type: [string, 'null'], format: date-time }
        webhook_enviado_em: { type: [string, 'null'], format: date-time }
        webhook_status_http: { type: [integer, 'null'] }
    WebhookMonitoramentoPayload:
      type: object
      required: [evento, monitoramento_id, execucao_id, numero_processo, status, houve_alteracao]
      properties:
        evento: { type: string, enum: [processo.monitoramento.executado] }
        monitoramento_id: { type: string, format: uuid }
        execucao_id: { type: string, format: uuid }
        numero_processo: { type: string }
        tribunal_id: { type: integer }
        executado_em: { type: [string, 'null'], format: date-time }
        status: { type: string, enum: [sucesso, falha] }
        houve_alteracao: { type: boolean }
        primeira_execucao:
          type: boolean
          description: "Presente quando status=sucesso. true = carga inicial (o processo não existia na base)."
        resumo:
          type: object
          description: "Presente quando status=sucesso."
          properties:
            movimentos_novos: { type: integer }
            documentos_novos: { type: integer }
            truncado: { type: boolean, description: "true quando alguma lista passou de 500 itens." }
        movimentos:
          type: array
          description: "Presente quando status=sucesso. Apenas os movimentos novos."
          items:
            type: object
            properties:
              identificador_movimento: { type: string }
              codigo_nacional: { type: [integer, 'null'] }
              complemento: { type: [string, 'null'] }
              data_hora: { type: [string, 'null'], format: date-time }
        documentos:
          type: array
          description: "Presente quando status=sucesso. Apenas metadados — o binário não é baixado pelo monitoramento."
          items:
            type: object
            properties:
              id_documento: { type: integer }
              descricao: { type: [string, 'null'] }
              tipo_documento: { type: [string, 'null'] }
              mimetype: { type: [string, 'null'] }
              data_hora: { type: [string, 'null'], format: date-time }
              nivel_sigilo: { type: [integer, 'null'] }
        proxima_execucao_em: { type: [string, 'null'], format: date-time }
        erro_resumo: { type: string, description: "Presente quando status=falha." }
        falhas_consecutivas: { type: integer, description: "Presente quando status=falha." }
        monitoramento_status:
          type: string
          enum: [ativo, pausado, suspenso, cancelado]
          description: "Presente quando status=falha. `suspenso` = parou de agendar; retome via PATCH."
    Tribunal:
      type: object
      properties:
        id: { type: integer, example: 1 }
        uuid: { type: string, format: uuid }
        nome: { type: string, example: "TJSP" }
        sigla:
          type: string
          x-dependencia: DEP-02
          description: |
            Sigla do tribunal no formato de `NumeroCnj::tribunal()` do Sistema
            Jurídico (`app/Support/NumeroCnj.php`), que a deriva do número CNJ:
            STF, STJ, STM, TST, TSE, `TRF` + região (TRF1), `TRT` + região
            (TRT2), `TRE-` + UF (TRE-SP), TJDFT, `TJ` + UF (TJSP) e `TJM` + UF
            (TJMSP). O cliente compara a sigla com o tribunal do caso.
          pattern: '^(STF|STJ|STM|TST|TSE|TJDFT|TRF[1-6]|TRT([1-9]|1[0-9]|2[0-4])|TRE-[A-Z]{2}|TJ[A-Z]{2}|TJM[A-Z]{2})$'
          examples: [TJSP, TRF1, TRT2, TRE-SP, TJDFT, TJMSP]
        grau:
          type: [string, 'null']
          enum: ['1', '2', null]
          x-dependencia: DEP-02
          description: |
            Grau da linha (`"1"` ou `"2"`), quando o tribunal tem uma linha por
            grau no ms-mni, como o PJe de 1º e 2º grau do TJAP. Mais de uma
            linha ativa com a mesma sigla é esperado: o grau as distingue e o
            usuário escolhe a linha no cliente. `null` quando não se aplica.
          example: "1"
        tipo: { type: string, example: "Tribunal de Justiça" }
        ativo: { type: boolean, example: true }
        versao_mni:
          oneOf:
            - type: string
            - type: "null"
        codigo_peticao_inicial:
          oneOf:
            - type: string
            - type: "null"
        codigo_peticao_avulsa:
          oneOf:
            - type: string
            - type: "null"
        codigo_certidao_inicio_fim:
          oneOf:
            - type: string
            - type: "null"
        codigo_seeu:
          oneOf:
            - type: string
            - type: "null"
        usar_codigo_documento_padrao:
          oneOf:
            - type: boolean
            - type: "null"
        enviar_dados_criminais:
          oneOf:
            - type: boolean
            - type: "null"
        url_webservice_mni_consultar_processo:
          type: [string, 'null']
          description: "URL do webservice MNI usado para consulta de processos."
        url_webservice_mni_criminal:
          type: [string, 'null']
          description: "URL do webservice MNI usado para dados criminais (SEEU)."
    ProcessoParte:
      type: object
      properties:
        nome: { type: string, example: "Fulano de Tal" }
        cpf_cnpj:
          oneOf:
            - type: string
              example: "12345678900"
            - type: "null"
        polo:
          oneOf:
            - type: string
              example: "AT"
            - type: "null"
        cep:
          oneOf:
            - type: string
            - type: "null"
        logradouro:
          oneOf:
            - type: string
            - type: "null"
        numero:
          oneOf:
            - type: string
            - type: "null"
        bairro:
          oneOf:
            - type: string
            - type: "null"
        municipio:
          oneOf:
            - type: string
            - type: "null"
        estado:
          oneOf:
            - type: string
            - type: "null"
        representantes_processual:
          type: array
          items: { $ref: '#/components/schemas/RepresentanteProcessual' }
    RepresentanteProcessual:
      type: object
      x-dependencia: DEP-07
      description: Representante processual de uma parte (`partes[].representantes_processual`).
      properties:
        nome:
          oneOf:
            - type: string
              example: "JOSÉ RENATO SOARES"
            - type: "null"
        inscricao:
          oneOf:
            - type: string
              example: "AP2848"
              description: "Inscrição como veio do tribunal (ex.: UF da OAB seguida do número)."
            - type: "null"
        tipo_representante:
          oneOf:
            - type: string
              example: "A"
              description: "Código do tipo: `A` Advogado, `E` Escritório de Advocacia, `M` Ministério Público, `D` Defensoria Pública, `P` Outros órgãos."
            - type: "null"
        numero_documento_principal:
          oneOf:
            - type: string
            - type: "null"
    Prioridade:
      type: object
      x-dependencia: DEP-07
      description: Prioridade de tramitação do processo (`prioridades`).
      properties:
        descricao:
          oneOf:
            - type: string
              example: "Idoso(a)"
            - type: "null"
    Movimento:
      type: object
      properties:
        identificador_movimento:
          oneOf:
            - type: string
            - type: "null"
        codigo_nacional:
          oneOf:
            - type: string
            - type: "null"
        complemento:
          oneOf:
            - type: string
            - type: "null"
        data_hora:
          oneOf:
            - type: string
              format: date-time
            - type: "null"
        id_documento_vinculado:
          oneOf:
            - type: string
            - type: "null"
    Documento:
      type: object
      properties:
        id_documento: { type: integer, example: 12345 }
        id_documento_vinculado:
          oneOf:
            - type: integer
            - type: "null"
        tipo_documento:
          oneOf:
            - type: string
            - type: "null"
        tipo:
          oneOf:
            - type: string
              description: "Descrição do tipo, resolvida em /processo/documentos/listar. Vem também em /processo/visualizar, resolvida sem uma consulta por documento (DEP-07)."
            - type: "null"
        descricao:
          oneOf:
            - type: string
            - type: "null"
        movimento:
          oneOf:
            - type: string
            - type: "null"
        data_hora:
          oneOf:
            - type: string
              format: date-time
            - type: "null"
        data_juntada:
          oneOf:
            - type: string
              format: date-time
              description: "Data da juntada aos autos. Vem também em /processo/visualizar (DEP-07)."
            - type: "null"
        usuario_juntada_arquivo:
          oneOf:
            - type: string
              description: "Quem juntou o documento. Vem também em /processo/visualizar (DEP-07)."
            - type: "null"
        mimetype:
          oneOf:
            - type: string
              description: "Tipo do arquivo; a string vazia é o documento ainda não baixado. Vem também em /processo/visualizar (DEP-07)."
            - type: "null"
        hash:
          oneOf:
            - type: string
            - type: "null"
        nivel_sigilo:
          oneOf:
            - type: integer
            - type: "null"
        status:
          oneOf:
            - type: string
              enum: [baixado, pendente, erro]
            - type: "null"
        file_size:
          oneOf:
            - type: integer
              description: "Tamanho do arquivo em bytes. Vem também em /processo/visualizar (DEP-07)."
            - type: "null"
        link:
          oneOf:
            - type: string
              format: uri
              description: "URL temporária S3 (validade 60 min), presente apenas em /documento/visualizar. Num documento `text/html`, aponta para o PDF renderizado (DEP-07)."
            - type: "null"
        ocr_situacao:
          x-dependencia: DEP-07
          description: |
            Situação do documento no OCR, presente apenas em
            /processo/visualizar e calculada no ms-mni: `ignorado` só quando o
            `mimetype` não é vazio e está fora dos formatos que o OCR lê; nos
            demais casos, a situação gravada, e a nula sai `pendente`. O
            documento ainda não baixado (`mimetype` vazio) sai `pendente`,
            nunca `ignorado`.
          oneOf:
            - type: string
              enum: [pendente, enviado, processado, erro, ignorado]
            - type: "null"
        conteudo_html:
          x-dependencia: DEP-07
          description: |
            HTML do documento, presente apenas em /documento/visualizar e
            preenchido só em `text/html`; nos demais tipos, null.
          oneOf:
            - type: string
            - type: "null"
    Processo:
      type: object
      description: |
        Processo com relações. As relações presentes variam por endpoint.
        Campos ocultos do model (id, tribunal_id, payload_envio, etc.) não aparecem.
      properties:
        numero_processo: { type: string }
        jurisdicao_codigo:
          oneOf:
            - type: string
            - type: "null"
        classe_codigo:
          oneOf:
            - type: string
            - type: "null"
        assunto_codigo:
          oneOf:
            - type: string
            - type: "null"
        competencia_codigo:
          oneOf:
            - type: string
            - type: "null"
        valor_causa:
          oneOf:
            - type: string
            - type: "null"
        nivel_sigilo:
          oneOf:
            - type: integer
            - type: "null"
        status:
          oneOf:
            - type: string
            - type: "null"
        justica_gratuita:
          oneOf:
            - type: boolean
            - type: "null"
        pedido_liminar:
          oneOf:
            - type: boolean
            - type: "null"
        nome_orgao_julgador:
          oneOf:
            - type: string
            - type: "null"
        codigo_orgao_julgador:
          oneOf:
            - type: string
            - type: "null"
        instancia_orgao_julgador:
          oneOf:
            - type: string
            - type: "null"
        tribunal: { $ref: '#/components/schemas/Tribunal' }
        classe:
          oneOf:
            - type: object
            - type: "null"
        assuntos: { type: array, items: { type: object } }
        prioridades: { type: array, items: { $ref: '#/components/schemas/Prioridade' } }
        partes:
          type: array
          items: { $ref: '#/components/schemas/ProcessoParte' }
        movimentos:
          type: array
          items: { $ref: '#/components/schemas/Movimento' }
        documentos:
          type: array
          items: { $ref: '#/components/schemas/Documento' }
    PaginacaoProcessos:
      type: object
      description: Envelope padrão do paginate() do Laravel.
      properties:
        current_page: { type: integer, example: 1 }
        data:
          type: array
          items: { $ref: '#/components/schemas/Processo' }
        first_page_url: { type: string }
        from:
          oneOf:
            - type: integer
            - type: "null"
        last_page: { type: integer, example: 1 }
        last_page_url: { type: string }
        next_page_url:
          oneOf:
            - type: string
            - type: "null"
        path: { type: string }
        per_page: { type: integer, example: 10 }
        prev_page_url:
          oneOf:
            - type: string
            - type: "null"
        to:
          oneOf:
            - type: integer
            - type: "null"
        total: { type: integer, example: 1 }
    ExportacaoEnfileirada:
      type: object
      properties:
        message: { type: string, example: "Exportação enfileirada" }
        exportacao_id: { type: integer, example: 42 }
    RetornoDoWorkflowOcr:
      x-dependencia: DEP-04
      description: Corpo que o workflow manda ao `webhook_url` (nós "Avisar o sistema" e "Avisar falha").
      oneOf:
        - { $ref: '#/components/schemas/RetornoDoWorkflowOcrSucesso' }
        - { $ref: '#/components/schemas/RetornoDoWorkflowOcrFalha' }
    RetornoDoWorkflowOcrSucesso:
      type: object
      x-dependencia: DEP-04
      required: [status, job_id]
      properties:
        status: { type: string, const: success }
        job_id: { type: string, minLength: 1, description: "O `id` do `202` do envio (CT-03)." }
        message: { type: string, example: "OCR + RAG processados com sucesso" }
        bucket_destino: { type: [string, 'null'] }
        path_destino: { type: [string, 'null'] }
        indexed_chunks: { type: [integer, 'null'], minimum: 0 }
    RetornoDoWorkflowOcrFalha:
      type: object
      x-dependencia: DEP-04
      required: [status, job_id]
      properties:
        status: { type: string, const: error }
        job_id: { type: string, minLength: 1, description: "O `id` do `202` do envio (CT-03)." }
        message: { type: string, example: "Falha ao processar OCR+RAG" }
        error_detail: { type: [string, 'null'] }
        error: { type: [string, 'null'] }
  parameters:
    LoginPje:
      name: login_pje
      in: query
      required: false
      description: >-
        Login do usuário no PJe. Opcional: quando omitido (ou quando só uma das
        duas credenciais é enviada), o servidor usa o par padrão configurado em
        PJE_LOGIN_PADRAO/PJE_SENHA_PADRAO; sem par padrão, valem as credenciais
        cadastradas no tribunal. Enviado na query string (ver aviso de segurança).
      schema: { type: string }
    SenhaPje:
      name: senha_pje
      in: query
      required: false
      description: >-
        Senha do usuário no PJe. Opcional, seguindo a mesma cadeia de login_pje:
        requisição → PJE_SENHA_PADRAO → credencial do tribunal. Enviada na query
        string (ver aviso de segurança).
      schema: { type: string }
    TribunalIdQuery:
      name: tribunal_id
      in: query
      required: false
      description: ID do tribunal. Obrigatório na prática para consultas de processo.
      schema: { type: integer }
    NumeroProcessoQuery:
      name: numero_processo
      in: query
      required: false
      description: Número do processo (será normalizado internamente).
      schema: { type: string }
    DataReferencia:
      name: data_referencia
      in: query
      required: false
      description: Data de referência para filtro incremental (movimentos/documentos).
      schema: { type: string, format: date }
    IdDocumento:
      name: id_documento
      in: query
      required: true
      description: Identificador do documento no processo.
      schema: { type: string }
    MonitoramentoUuid:
      name: uuid
      in: path
      required: true
      description: uuid público do monitoramento.
      schema: { type: string, format: uuid }
  responses:
    Erro400:
      description: Requisição inválida (parâmetro obrigatório ausente).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Erro' }
          example: { error: "Tribunal não informado" }
    Erro401:
      description: Token inválido ou não fornecido.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErroMensagem' }
          example: { message: "Token inválido ou não fornecido" }
    Erro422:
      description: Falha de validação (ex. callback_url/callback_token ausentes nos endpoints assíncronos).
      content:
        application/json:
          schema:
            type: object
            properties:
              message: { type: string }
              errors:
                type: object
                additionalProperties:
                  type: array
                  items: { type: string }
          example:
            message: "The callback url field is required."
            errors: { callback_url: ["The callback url field is required."] }
    Erro404Monitoramento:
      description: |
        Monitoramento não encontrado. Também é a resposta para um uuid que
        pertence a outro token — a API não confirma a existência do recurso.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErroMensagem' }
    Erro500:
      description: Erro interno / exceção MNI.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Erro' }
    Erro500Generico:
      description: Erro interno.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErroMensagem' }
