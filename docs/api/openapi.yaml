openapi: 3.1.0
info:
  title: API MNI/PJe — ms-mni
  version: "1.0.0"
  description: |
    API REST externa do ms-mni para consulta de processos, documentos e
    tribunais via integração MNI/PJe.

    ## Autenticação
    Todas as rotas exigem o header `X-API-Token` com um token válido.

    ## Aviso de segurança
    Os endpoints `GET` recebem `login_pje` e `senha_pje` como **query params**.
    Isso expõe credenciais PJe na URL (logs de servidor, histórico de proxy).
    **Não registre em log as URLs completas destas requisições.**
servers:
  - url: https://{host}/api
    description: Servidor da aplicação
    variables:
      host:
        default: localhost:8006
security:
  - ApiToken: []
tags:
  - name: Processos
    description: Consulta e exportação de processos
  - name: Documentos
    description: Consulta e download de documentos
  - name: Tribunais
    description: Listagem de tribunais
paths:
  /tribunais:
    get:
      tags: [Tribunais]
      summary: Listar tribunais ativos
      description: Retorna todos os tribunais com `ativo = true`.
      responses:
        '200':
          description: Lista de tribunais.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Tribunal' }
        '401': { $ref: '#/components/responses/Erro401' }
  /tribunais/{uuid}:
    get:
      tags: [Tribunais]
      summary: Obter tribunal por uuid
      parameters:
        - name: uuid
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Tribunal encontrado (ou `null` se não existir).
          content:
            application/json:
              schema:
                oneOf:
                  - { $ref: '#/components/schemas/Tribunal' }
                  - { type: 'null' }
        '401': { $ref: '#/components/responses/Erro401' }
  /processo/consultar:
    get:
      tags: [Processos]
      summary: Buscar processos por número ou nome de parte
      description: |
        Busca paginada (10 por página). Informe `numero_processo` **ou**
        `nomeParte`. Na busca por número: se o processo não existe no banco,
        é baixado do MNI de forma síncrona; se existe, uma atualização é
        disparada em background.
      parameters:
        - { $ref: '#/components/parameters/LoginPje' }
        - { $ref: '#/components/parameters/SenhaPje' }
        - { $ref: '#/components/parameters/TribunalIdQuery' }
        - { $ref: '#/components/parameters/NumeroProcessoQuery' }
        - name: nomeParte
          in: query
          required: false
          schema: { type: string }
      responses:
        '200':
          description: Página de processos.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaginacaoProcessos' }
        '400': { $ref: '#/components/responses/Erro400' }
        '401': { $ref: '#/components/responses/Erro401' }
        '422': { $ref: '#/components/responses/Erro422' }
        '500': { $ref: '#/components/responses/Erro500' }
  /processo/visualizar:
    get:
      tags: [Processos]
      summary: Obter processo completo
      description: |
        Retorna um processo com relações completas (tribunal, partes e
        representantes, prioridades, classe, assuntos, movimentos, documentos).
        Baixa do MNI se ausente; senão dispara atualização em background.
      parameters:
        - { $ref: '#/components/parameters/LoginPje' }
        - { $ref: '#/components/parameters/SenhaPje' }
        - { $ref: '#/components/parameters/TribunalIdQuery' }
        - { $ref: '#/components/parameters/NumeroProcessoQuery' }
      responses:
        '200':
          description: Processo encontrado.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Processo' }
        '400': { $ref: '#/components/responses/Erro400' }
        '401': { $ref: '#/components/responses/Erro401' }
        '422': { $ref: '#/components/responses/Erro422' }
        '500': { $ref: '#/components/responses/Erro500' }
  /processo/dados-basicos:
    get:
      tags: [Processos]
      summary: Dados básicos do processo (síncrono)
      description: |
        Retorna dados básicos (tribunal, classe, assuntos, prioridades, partes
        e representantes). Se existe no banco, retorna direto; senão consulta o
        MNI de forma síncrona.
      parameters:
        - { $ref: '#/components/parameters/LoginPje' }
        - { $ref: '#/components/parameters/SenhaPje' }
        - { $ref: '#/components/parameters/TribunalIdQuery' }
        - { $ref: '#/components/parameters/NumeroProcessoQuery' }
      responses:
        '200':
          description: Dados básicos do processo.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Processo' }
        '401': { $ref: '#/components/responses/Erro401' }
        '422': { $ref: '#/components/responses/Erro422' }
        '500': { $ref: '#/components/responses/Erro500' }
components:
  securitySchemes:
    ApiToken:
      type: apiKey
      in: header
      name: X-API-Token
      description: Token de API emitido pelo ms-mni.
  schemas:
    Erro:
      type: object
      description: Erro genérico com detalhes de origem (respostas 500).
      properties:
        error:
          type: string
          example: "Mensagem do erro"
        line:
          type: integer
          example: 49
        file:
          type: string
          example: "/app/Http/Controllers/Api/ConsultarProcessoController.php"
      required: [error]
    ErroMensagem:
      type: object
      description: Erro simples com apenas mensagem.
      properties:
        message:
          type: string
          example: "Token inválido ou não fornecido"
      required: [message]
    Tribunal:
      type: object
      properties:
        id: { type: integer, example: 1 }
        uuid: { type: string, format: uuid }
        nome: { type: string, example: "TJSP" }
        tipo: { type: string, example: "Tribunal de Justiça" }
        ativo: { type: boolean, example: true }
        versao_mni:
          oneOf:
            - type: string
            - type: "null"
        codigo_peticao_inicial:
          oneOf:
            - type: string
            - type: "null"
        codigo_peticao_avulsa:
          oneOf:
            - type: string
            - type: "null"
        codigo_certidao_inicio_fim:
          oneOf:
            - type: string
            - type: "null"
        codigo_seeu:
          oneOf:
            - type: string
            - type: "null"
        usar_codigo_documento_padrao:
          oneOf:
            - type: boolean
            - type: "null"
        enviar_dados_criminais:
          oneOf:
            - type: boolean
            - type: "null"
    ProcessoParte:
      type: object
      properties:
        nome: { type: string, example: "Fulano de Tal" }
        cpf_cnpj:
          oneOf:
            - type: string
              example: "12345678900"
            - type: "null"
        polo:
          oneOf:
            - type: string
              example: "AT"
            - type: "null"
        cep:
          oneOf:
            - type: string
            - type: "null"
        logradouro:
          oneOf:
            - type: string
            - type: "null"
        numero:
          oneOf:
            - type: string
            - type: "null"
        bairro:
          oneOf:
            - type: string
            - type: "null"
        municipio:
          oneOf:
            - type: string
            - type: "null"
        estado:
          oneOf:
            - type: string
            - type: "null"
        representantes_processual:
          type: array
          items: { type: object }
    Movimento:
      type: object
      properties:
        identificador_movimento:
          oneOf:
            - type: string
            - type: "null"
        codigo_nacional:
          oneOf:
            - type: string
            - type: "null"
        complemento:
          oneOf:
            - type: string
            - type: "null"
        data_hora:
          oneOf:
            - type: string
              format: date-time
            - type: "null"
        id_documento_vinculado:
          oneOf:
            - type: string
            - type: "null"
    Documento:
      type: object
      properties:
        id_documento: { type: integer, example: 12345 }
        id_documento_vinculado:
          oneOf:
            - type: integer
            - type: "null"
        tipo_documento:
          oneOf:
            - type: string
            - type: "null"
        tipo:
          oneOf:
            - type: string
              description: "Descrição do tipo, resolvida em /processo/documentos/listar."
            - type: "null"
        descricao:
          oneOf:
            - type: string
            - type: "null"
        movimento:
          oneOf:
            - type: string
            - type: "null"
        data_hora:
          oneOf:
            - type: string
              format: date-time
            - type: "null"
        data_juntada:
          oneOf:
            - type: string
              format: date-time
            - type: "null"
        usuario_juntada_arquivo:
          oneOf:
            - type: string
            - type: "null"
        mimetype:
          oneOf:
            - type: string
            - type: "null"
        hash:
          oneOf:
            - type: string
            - type: "null"
        nivel_sigilo:
          oneOf:
            - type: integer
            - type: "null"
        status:
          oneOf:
            - type: string
              enum: [baixado, pendente, erro]
            - type: "null"
        file_size:
          oneOf:
            - type: integer
            - type: "null"
        link:
          oneOf:
            - type: string
              format: uri
              description: "URL temporária S3 (validade 60 min), presente apenas em /documento/visualizar."
            - type: "null"
    Processo:
      type: object
      description: |
        Processo com relações. As relações presentes variam por endpoint.
        Campos ocultos do model (id, tribunal_id, payload_envio, etc.) não aparecem.
      properties:
        numero_processo: { type: string }
        jurisdicao_codigo:
          oneOf:
            - type: string
            - type: "null"
        classe_codigo:
          oneOf:
            - type: string
            - type: "null"
        assunto_codigo:
          oneOf:
            - type: string
            - type: "null"
        competencia_codigo:
          oneOf:
            - type: string
            - type: "null"
        valor_causa:
          oneOf:
            - type: string
            - type: "null"
        nivel_sigilo:
          oneOf:
            - type: integer
            - type: "null"
        status:
          oneOf:
            - type: string
            - type: "null"
        justica_gratuita:
          oneOf:
            - type: boolean
            - type: "null"
        pedido_liminar:
          oneOf:
            - type: boolean
            - type: "null"
        nome_orgao_julgador:
          oneOf:
            - type: string
            - type: "null"
        codigo_orgao_julgador:
          oneOf:
            - type: string
            - type: "null"
        instancia_orgao_julgador:
          oneOf:
            - type: string
            - type: "null"
        tribunal: { $ref: '#/components/schemas/Tribunal' }
        classe:
          oneOf:
            - type: object
            - type: "null"
        assuntos: { type: array, items: { type: object } }
        prioridades: { type: array, items: { type: object } }
        partes:
          type: array
          items: { $ref: '#/components/schemas/ProcessoParte' }
        movimentos:
          type: array
          items: { $ref: '#/components/schemas/Movimento' }
        documentos:
          type: array
          items: { $ref: '#/components/schemas/Documento' }
    PaginacaoProcessos:
      type: object
      description: Envelope padrão do paginate() do Laravel.
      properties:
        current_page: { type: integer, example: 1 }
        data:
          type: array
          items: { $ref: '#/components/schemas/Processo' }
        first_page_url: { type: string }
        from:
          oneOf:
            - type: integer
            - type: "null"
        last_page: { type: integer, example: 1 }
        last_page_url: { type: string }
        next_page_url:
          oneOf:
            - type: string
            - type: "null"
        path: { type: string }
        per_page: { type: integer, example: 10 }
        prev_page_url:
          oneOf:
            - type: string
            - type: "null"
        to:
          oneOf:
            - type: integer
            - type: "null"
        total: { type: integer, example: 1 }
    ExportacaoEnfileirada:
      type: object
      properties:
        message: { type: string, example: "Exportação enfileirada" }
        exportacao_id: { type: integer, example: 42 }
  parameters:
    LoginPje:
      name: login_pje
      in: query
      required: true
      description: Login do usuário no PJe. Enviado na query string (ver aviso de segurança).
      schema: { type: string }
    SenhaPje:
      name: senha_pje
      in: query
      required: true
      description: Senha do usuário no PJe. Enviada na query string (ver aviso de segurança).
      schema: { type: string }
    TribunalIdQuery:
      name: tribunal_id
      in: query
      required: false
      description: ID do tribunal. Obrigatório na prática para consultas de processo.
      schema: { type: integer }
    NumeroProcessoQuery:
      name: numero_processo
      in: query
      required: false
      description: Número do processo (será normalizado internamente).
      schema: { type: string }
    DataReferencia:
      name: data_referencia
      in: query
      required: false
      description: Data de referência para filtro incremental (movimentos/documentos).
      schema: { type: string, format: date }
    IdDocumento:
      name: id_documento
      in: query
      required: true
      description: Identificador do documento no processo.
      schema: { type: string }
  responses:
    Erro400:
      description: Requisição inválida (parâmetro obrigatório ausente).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Erro' }
          example: { error: "Tribunal não informado" }
    Erro401:
      description: Token inválido ou não fornecido.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErroMensagem' }
          example: { message: "Token inválido ou não fornecido" }
    Erro422:
      description: Falha de validação (ex. login_pje/senha_pje ausentes).
      content:
        application/json:
          schema:
            type: object
            properties:
              message: { type: string }
              errors:
                type: object
                additionalProperties:
                  type: array
                  items: { type: string }
          example:
            message: "The login pje field is required."
            errors: { login_pje: ["The login pje field is required."] }
    Erro500:
      description: Erro interno / exceção MNI.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Erro' }
