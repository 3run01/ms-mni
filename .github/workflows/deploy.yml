name: Build and Deploy to ECS

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to ECS
    runs-on: ubuntu-latest
    permissions:
      contents: write  # necessário para push de git tags (version-manager.sh)

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ vars.AWS_REGION || 'sa-east-1' }}

    - name: Login to Amazon ECR
      uses: aws-actions/amazon-ecr-login@v2

    - name: Setup and determine version
      run: .github/scripts/setup.sh

    - name: Build Docker images
      run: .github/scripts/docker-build.sh

    - name: Push images to ECR
      run: .github/scripts/ecr-push.sh

    - name: Deploy to ECS
      run: .github/scripts/ecs-deploy.sh
      
    # - name: Monitor ECS deployment and logs
    #   run: .github/scripts/ecs-monitor.sh      

    - name: Generate deployment summary
      run: .github/scripts/summary.sh